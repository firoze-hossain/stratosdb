apiVersion: v1
kind: Service
metadata:
  name: {{ include "stratosdb.primaryFullname" . }}
  labels:
    {{- include "stratosdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
  {{- with .Values.service.primary.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.primary.type }}
  ports:
    - port: {{ .Values.service.primary.stdwirePort }}
      targetPort: stdwire
      protocol: TCP
      name: stdwire
    - port: {{ .Values.service.primary.nativePort }}
      targetPort: native
      protocol: TCP
      name: native
    - port: {{ .Values.ports.replication }}
      targetPort: replication
      protocol: TCP
      name: replication
  selector:
    {{- include "stratosdb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
