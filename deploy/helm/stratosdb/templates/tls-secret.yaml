{{- if and .Values.tls.enabled .Values.tls.autoGenerate (not .Values.tls.existingSecret) }}
{{- $ca := genCA (default "stratosdb-cluster-ca" .Values.tls.caCommonName) (int (default 365 .Values.tls.certValidityDays)) }}
{{- $dnsNames := list (printf "%s-raft" (include "stratosdb.fullname" .)) (printf "*.%s-raft.%s.svc.cluster.local" (include "stratosdb.fullname" .) .Release.Namespace) (printf "%s-primary" (include "stratosdb.fullname" .)) "localhost" }}
{{- $cert := genSignedCert (include "stratosdb.fullname" .) (list "127.0.0.1") $dnsNames (int (default 365 .Values.tls.certValidityDays)) $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stratosdb.fullname" . }}-tls
  labels:
    {{- include "stratosdb.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
