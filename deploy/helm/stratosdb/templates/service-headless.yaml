apiVersion: v1
kind: Service
metadata:
  name: {{ include "stratosdb.headlessServiceName" . }}
  labels:
    {{- include "stratosdb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.ports.stdwire }}
      name: stdwire
      targetPort: stdwire
    - port: {{ .Values.ports.native }}
      name: native
      targetPort: native
    - port: {{ .Values.ports.replication }}
      name: replication
      targetPort: replication
  selector:
    {{- include "stratosdb.selectorLabels" . | nindent 4 }}
