# ==============================================================================
# StratosDB Configuration File
# Default location: /etc/stratosdb/stratosdb.conf
# ==============================================================================

# Network port for client connections (PostgreSQL wire protocol v3)
# Default: 6582
port=6582

# Storage directory where database files, tables, and write-ahead logs (WAL) reside
# Default: /var/lib/stratosdb/data
data_directory=/var/lib/stratosdb/data

# Cluster mode:
#   true  = PostgreSQL-compatible multi-database mode (CREATE DATABASE, multiple databases)
#   false = Single database mode (SQLite-style single isolated database)
# Default: true
cluster=true

# Buffer pool cache size in pages (8KB per page, 1024 pages = 8MB cache)
# Default: 1024
buffer_pool_size=1024

# Synchronous WAL commit (guarantees durability at commit time)
# Default: true
sync_wal=true

# Maximum concurrent client connections
# Default: 100
max_connections=100

# Background autovacuum interval in milliseconds (0 = disabled)
# Default: 0
autovacuum_interval_ms=0

# Log queries taking longer than threshold in milliseconds (-1 = disabled)
# Default: -1
slow_query_threshold_ms=-1
