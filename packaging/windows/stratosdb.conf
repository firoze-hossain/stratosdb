# ==============================================================================
# StratosDB Configuration File (Windows)
# ==============================================================================

# Network port for client connections (PostgreSQL wire protocol v3)
# Default: 6582
port=6582

# Storage directory for database files and WAL logs
# Default: C:\ProgramData\StratosDB\data
data_directory=C:\ProgramData\StratosDB\data

# Cluster mode: true for multi-database PostgreSQL-style server, false for single-database
cluster=true

# Performance tuning
buffer_pool_size=1024
sync_wal=true
max_connections=100
autovacuum_interval_ms=0
slow_query_threshold_ms=-1
