name: Release

# ==============================================================================
# Automated Multi-Platform Release Workflow for StratosDB
# 
# Triggered ONLY when a version tag like 'v1.0.0' is pushed to the repository.
# Standard code pushes to master/branches do NOT trigger this workflow.
#
# Builds native installers across 3 parallel runner environments:
#   - Linux:   Ubuntu/Debian .deb package (with interactive config & systemd daemon)
#   - Windows: Inno Setup .exe installer wizard (with Port, Data Dir, Windows Service)
#              plus WiX .msi package
#   - macOS:   Apple .dmg disk image (with LaunchDaemon service setup)
#
# Collects all artifacts, generates SHA-256 checksums, and publishes a GitHub Release.
# ==============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JPACKAGE_MODULES: java.base,java.desktop,java.sql,java.logging,java.management,java.naming,jdk.httpserver,jdk.unsupported

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Windows Tools (WiX & Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Derive version from Git tag
        shell: bash
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Standalone Server and CLI Jars with Maven
        run: mvn -B -pl stratosdb-network,stratosdb-cli -am package -DskipTests

      - name: Prepare common packaging input
        shell: bash
        run: |
          mkdir -p packaging/input dist
          cp stratosdb-network/target/*-standalone.jar packaging/input/stratosdb-server.jar
          cp stratosdb-cli/target/*-standalone.jar packaging/input/stratosdb-cli.jar
          cp packaging/linux/stratosdb.conf packaging/input/
          cp packaging/linux/stratosdb.service packaging/input/
          cp packaging/linux/stratosdb-setup packaging/input/
          cp packaging/README.txt packaging/input/

      # ------------------------------------------------------------------------
      # Linux: Ubuntu/Debian .deb package
      # ------------------------------------------------------------------------
      - name: Build Linux .deb Package
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          jpackage \
            --type deb \
            --input packaging/input \
            --name stratosdb \
            --main-jar stratosdb-server.jar \
            --main-class com.stratosdb.network.server.StratosServerMain \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor "StratosDB" \
            --description "StratosDB - High-performance Relational Database Engine with Native StratosWire Binary Protocol" \
            --linux-package-name stratosdb \
            --linux-deb-maintainer "maintainer@stratosdb.dev" \
            --add-modules "${{ env.JPACKAGE_MODULES }}" \
            --resource-dir packaging/linux \
            --dest dist

      # ------------------------------------------------------------------------
      # Windows: Inno Setup .exe Setup Wizard & WiX .msi
      # ------------------------------------------------------------------------
      - name: Build Windows .exe Setup Wizard and .msi
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # 1. Create Windows runtime app image
          jpackage `
            --type app-image `
            --input packaging/input `
            --name stratosdb `
            --main-jar stratosdb-server.jar `
            --main-class com.stratosdb.network.server.StratosServerMain `
            --app-version "${{ steps.version.outputs.version }}" `
            --vendor "StratosDB" `
            --win-console `
            --add-modules "${{ env.JPACKAGE_MODULES }}" `
            --dest dist\stratosdb-win-pkg

          # Move contents into a clean root structure for Inno Setup
          Move-Item -Path "dist\stratosdb-win-pkg\stratosdb\*" -Destination "dist\stratosdb-win-pkg\"
          Remove-Item -Path "dist\stratosdb-win-pkg\stratosdb" -Recurse -Force

          # 2. Compile Inno Setup .exe wizard
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ steps.version.outputs.version }}" packaging\windows\setup.iss

          # 3. Build Windows .msi with jpackage
          jpackage `
            --type msi `
            --input packaging/input `
            --name stratosdb `
            --main-jar stratosdb-server.jar `
            --main-class com.stratosdb.network.server.StratosServerMain `
            --app-version "${{ steps.version.outputs.version }}" `
            --vendor "StratosDB" `
            --description "StratosDB - High-performance Relational Database Engine with Native StratosWire Binary Protocol" `
            --win-console `
            --win-menu `
            --win-shortcut `
            --add-modules "${{ env.JPACKAGE_MODULES }}" `
            --dest dist

          # Clean intermediate app-image so only final installers remain
          Remove-Item -Path "dist\stratosdb-win-pkg" -Recurse -Force

      # ------------------------------------------------------------------------
      # macOS: .dmg disk image
      # ------------------------------------------------------------------------
      - name: Build macOS .dmg Disk Image
        if: matrix.platform == 'macos'
        run: |
          cp packaging/macos/setup-service.command packaging/input/
          cp packaging/macos/com.stratosdb.server.plist packaging/input/
          cp packaging/macos/stdsql packaging/input/
          jpackage \
            --type dmg \
            --input packaging/input \
            --name StratosDB \
            --main-jar stratosdb-server.jar \
            --main-class com.stratosdb.network.server.StratosServerMain \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor "StratosDB" \
            --description "StratosDB - High-performance Relational Database Engine with Native StratosWire Binary Protocol" \
            --mac-package-name StratosDB \
            --add-modules "${{ env.JPACKAGE_MODULES }}" \
            --dest dist

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stratosdb-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum *.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List Release Files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
